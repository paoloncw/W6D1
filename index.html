<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpiShop — E-commerce</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

  <header class="bg-primary text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="fs-3 m-0">Epishop</h1>
      <nav>
        <a href="#" class="text-white text-decoration-none mx-2">Home</a>
        <a href="#" class="text-white text-decoration-none mx-2">Prodotti</a>
        <a href="#" class="text-white text-decoration-none mx-2">Servizi</a>
      </nav>
    </div>
  </header>

  <section class="bg-light py-5">
    <div class="container text-center">
      <h2 class="fs-1 fw-bold mb-3">Saldi di primavera</h2>
      <p class="fs-5 text-body-secondary mb-4">questa è la mia frase casuale a scelta</p>
      <a href="#" class="d-inline-block bg-primary text-white text-decoration-none py-2 px-4 rounded">Vedi i prodotti</a>
    </div>
  </section>

  <main class="container my-4">
    <div class="row">

      <aside>
        <!-- Sidebar categorie. Visibile solo da lg in su (d-none d-lg-block) -->
      </aside>

      <section>
        <!-- Griglia prodotti responsive (1 / 2 / 3 / 4 per riga in base al breakpoint) -->
      </section>

    </div>
  </main>

  <footer>
    <!-- Footer scuro centrato con copyright -->
  </footer>

</body>

</html>
