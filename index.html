<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpiShop — E-commerce</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <nav class="navbar navbar-expand-md bg-primary navbar-dark">
    <div class="container">

      <a class="navbar-brand fw-bold" href="#">EpiShop</a>

      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav-menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="nav-menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link">Home</a></li>
          <li class="nav-item"><a class="nav-link">Prodotti</a></li>
          <li class="nav-item"><a class="nav-link">Contatti</a></li>
        </ul>
        <button id="toggle-tema" type="button" class="btn btn-outline-light ms-md-2 mt-2 mt-md-0">Tema scuro</button>
      </div>
    </div>
  </nav>

  <div id="hero" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3500">
    <div class="carousel-inner" id="slides-container"></div>

    <button class="carousel-control-prev" type="button" data-bs-target="#hero" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#hero" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <main class="container my-4">
    <div class="alert alert-info alert-dismissible">Spedizione gratis sopra i 50 €. <button type="button"
        class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button></div>

    <div class="row">

      <aside class="col-lg-3 d-none d-lg-block">
        <div class="bg-light p-3 rounded border">
          <h3 class="fs-5 fw-bold mb-3">Categorie</h3>
          <p class="m-0 mb-2">Scarpe</p>
          <p class="m-0 mb-2">Borse</p>
          <p class="m-0 mb-2">Giacche</p>
          <p class="m-0 mb-2">Accessori</p>
        </div>
      </aside>

      <section class="col-12 col-lg-9">
        <h2 class="fs-3 fw-bold mb-4 text-center text-md-start">Prodotti in evidenza <span
            class="badge bg-danger fs-6">-30%</span></h2>
        <!-- Bottoni filtro per categoria -->
        <div id="filtri" class="mb-4">
          <button type="button" class="btn btn-outline-primary me-2 mb-2 active" data-categoria="tutti">Tutti</button>
          <button type="button" class="btn btn-outline-primary me-2 mb-2" data-categoria="scarpe">Scarpe</button>
          <button type="button" class="btn btn-outline-primary me-2 mb-2"
            data-categoria="abbigliamento">Abbigliamento</button>
          <button type="button" class="btn btn-outline-primary me-2 mb-2" data-categoria="accessori">Accessori</button>
        </div>

        <!-- Contatore prodotti mostrati -->
        <p class="text-muted m-0">Mostrati: <span id="contatore">6</span> su 6</p>

        <!-- Qui JS inserisce le card -->
        <div id="contenitore-prodotti" class="row"></div>

        <!-- Totale del catalogo -->
        <p class="fw-bold mt-3" id="totale"></p>
      </section>

    </div>
  </main>

  <div id="modals-container"></div>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
      <p class="m-0">© 2026 EpiShop - tutti i diritti riservati</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="assets/js/script.js"></script>
</body>

</html>
